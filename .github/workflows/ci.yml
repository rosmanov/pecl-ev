name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          # 8.6 has no final release yet, this tag follows its latest pre-release
          - "8.6-rc"
          - "8.5.2"
          - "8.3.10"
        sanitizer:
          - none
        variant:
          - cli
        include:
          - php: "8.5.2" # latest stable version for ASAN builds
            sanitizer: asan
            variant: cli
          - php: "8.5"
            sanitizer: none
            variant: zts
          - php: "8.3" # oldest supported version
            sanitizer: none
            variant: zts

    container:
      image: php:${{ matrix.php }}-${{ matrix.variant }}

    steps:
      - uses: actions/checkout@v6

      - name: Build and run tests
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        shell: bash
        run: |
          ./ci/setup-php-docker.sh

          sockets_ini=$(php -i | grep -m 1 -o -E '/.*sockets\.ini' || true)
          test -z "$sockets_ini" || \
            mv -v "$sockets_ini" "$(echo "$sockets_ini" | sed -e 's/sockets.ini/0-sockets.ini/')"

          docker-php-source extract
          ./ci/build.sh
          echo 'extension=ev.so' > /usr/local/etc/php/conf.d/z-ev.ini

          ./ci/test.sh

          docker-php-source delete

  release-files:
    name: package.xml, php_ev.h and CHANGELOG.md agree
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check release metadata
        run: python3 ci/release.py check

  ci:
    name: CI
    if: always()
    needs: [test, release-files]
    runs-on: ubuntu-latest

    steps:
      - name: Check matrix result
        run: |
          test '${{ needs.test.result }}' = 'success'
          test '${{ needs['release-files'].result }}' = 'success'
